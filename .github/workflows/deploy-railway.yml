name: Deploy to Railway

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
    types: [closed]
  workflow_dispatch:

concurrency:
  group: deployment-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    # Only deploy on push to main/master or manual trigger
    # Don't deploy on PR (only on merge)
    if: |
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && github.event.pull_request.merged)

    runs-on: ubuntu-latest
    name: Deploy to Railway
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify Railway Token exists
        run: |
          if [ -z "${{ secrets.RAILWAY_TOKEN }}" ]; then
            echo "❌ RAILWAY_TOKEN secret not configured!"
            echo "See .github/RAILWAY_SETUP.md for setup instructions"
            exit 1
          fi
          echo "✅ Railway token is configured"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Verify build
        run: |
          echo "📦 Installing dependencies..."
          npm ci --prefer-offline --no-audit
          echo "✅ Dependencies installed"

      - name: Install Railway CLI
        run: |
          echo "📦 Installing Railway CLI..."
          npm install -g @railway/cli@latest
          railway --version
          echo "✅ Railway CLI installed"

      - name: Deploy to Railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          echo "🚀 Starting deployment to Railway..."
          railway link --service mp-dashboard || true
          railway up
          echo "✅ Deployment initiated"

      - name: Wait for deployment
        run: |
          echo "⏳ Waiting for Railway deployment to complete (this may take 2-3 minutes)..."
          sleep 30
          echo "✅ Deployment should be complete"

      - name: Create deployment summary
        if: always()
        run: |
          cat << EOF >> $GITHUB_STEP_SUMMARY
          ## 🚀 Railway Deployment Summary

          **Status:** ${{ job.status }}
          **Branch:** ${{ github.ref }}
          **Commit:** ${{ github.sha }}
          **Deployed by:** ${{ github.actor }}
          **Timestamp:** $(date -u +'%Y-%m-%d %H:%M:%S UTC')

          ### Next Steps:
          1. Visit Railway Dashboard to verify deployment
          2. Check service logs for any errors
          3. Test the application at https://myparliament.calmic.com.my

          **Important:** The ROI score fix requires regenerating report cards.
          Run: \`POST /api/admin/report-cards/update\`
          EOF

      - name: Post failure notification
        if: failure()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '❌ **Deployment to Railway failed!**\n\nCheck the [Actions logs](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}) for details.\n\nCommon issues:\n- Missing `RAILWAY_TOKEN` secret\n- Invalid Railway service name\n- Build errors\n\nSee `.github/RAILWAY_SETUP.md` for troubleshooting.'
            })
        continue-on-error: true
