[build]
builder = "nixpacks"

[deploy]
startCommand = "npm start"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

# Health checks for cost optimization
# Faster checks reduce resource usage
healthcheckPath = "/health"
healthcheckTimeout = 30000  # Reduced from 60s to 30s
healthcheckInterval = 20000  # Check every 20s

# Sleep detection to reduce costs during low traffic
# Railway will scale down if no requests
sleepAfterInactivitySec = 3600  # Sleep after 1 hour of inactivity

